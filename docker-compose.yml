services:
  mysql:
    image: mysql:8.4
    container_name: racing-archive-mysql
    environment:
      MYSQL_DATABASE: racing_archive
      MYSQL_USER: racing_archive
      MYSQL_PASSWORD: racing_archive
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "racing_archive", "-pracing_archive"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: racing-archive-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/racing_archive
      SPRING_DATASOURCE_USERNAME: racing_archive
      SPRING_DATASOURCE_PASSWORD: racing_archive
      RACING_ARCHIVE_SOURCES_DIRECTORY: /archive/events
    volumes:
      - ./archive/events:/archive/events:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
